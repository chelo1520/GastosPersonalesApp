<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>

<body>

  <main class="app-login">
    <div class="app-login-card">

      <div class="app-login-marca">
        <img th:src="@{/img/isotipo.svg}" width="44" height="44" alt="">
        <span>Gastitos</span>
      </div>

      <form action="#" th:action="@{/validar-login}" method="POST" th:object="${datosLogin}">

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input th:field="*{email}" id="email" type="email" class="form-control" autocomplete="username" required />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input th:field="*{password}" id="password" type="password" class="form-control"
            autocomplete="current-password" required />
        </div>

        <p th:if="${error != null}" class="alert alert-danger" th:text="${error}"></p>

        <div class="d-grid">
          <button id="btn-login" class="btn btn-primary" type="submit" disabled>Ingresar</button>
        </div>
      </form>

      <p class="app-login-registro">
        ¿Primera vez? <a id="btn-register" th:href="@{/nuevo-usuario}">Crear una cuenta</a>
      </p>

    </div>
  </main>

  <script th:replace="~{fragments/layout :: scripts}"></script>
  <script type="module" th:src="@{/js/login.js}"></script>
</body>

</html>
