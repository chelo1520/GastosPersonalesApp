<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

  <!--
    Registro rápido (rediseño v2): el mismo formulario y las mismas validaciones que la pantalla
    Registrar, pero sin salir de la vista. Guarda y vuelve con el aviso "Gasto guardado";
    "Guardar y cargar otro" lo reabre con la misma fecha y categoría; con error se reabre con lo cargado.
    Abajo, la carga desde un comprobante: sube el archivo y pasa a la pantalla de revisión.
      volver: vista a la que se vuelve ("resumen" o "mis-gastos")
    Modelo: categoriasRegistro, fechaHoy, fechaMinima, fechaMaxima, mesMostrado
            y, en flash, registroRapido (lo cargado) y errorRegistro
    Necesita css/registro-rapido.css y js/registro_rapido.js.
  -->
  <div th:fragment="modal(volver)" th:remove="tag">
    <div class="modal fade app-registro" id="modal-registro" tabindex="-1" aria-labelledby="registro-titulo" aria-hidden="true"
         th:attr="data-abrir=${registroRapido != null}">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content app-registro-contenido">
          <form th:action="@{/registrar-gasto}" method="post" id="form-registro" class="app-registro-form">
            <input type="hidden" name="volver" th:value="${volver}">
            <input type="hidden" name="mes" th:value="${mesMostrado}">

            <div class="app-registro-cabecera">
              <h2 class="app-registro-titulo" id="registro-titulo">Registrar gasto</h2>
              <button type="button" class="app-registro-cerrar" data-bs-dismiss="modal" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </button>
            </div>

            <div class="app-registro-error" role="alert" id="registro-error"
                 th:if="${errorRegistro != null}" th:text="${errorRegistro}">El importe debe ser mayor a cero</div>

            <div class="app-registro-campo">
              <label for="registro-importe">Importe</label>
              <div class="app-registro-importe">
                <span aria-hidden="true">$</span>
                <input id="registro-importe" name="importe" type="number" step="0.01" min="0.01" inputmode="decimal"
                       placeholder="0" required
                       th:value="${registroRapido?.importe != null} ? ${#numbers.formatDecimal(registroRapido.importe, 1, 'NONE', 2, 'POINT')}">
              </div>
            </div>

            <div class="app-registro-campo">
              <label for="registro-descripcion">Descripción</label>
              <input id="registro-descripcion" name="descripcion" type="text" maxlength="255" required
                     placeholder="Ej.: Compra semanal en el súper" th:value="${registroRapido?.descripcion}">
            </div>

            <div class="app-registro-fila">
              <div class="app-registro-campo">
                <label for="registro-categoria">Categoría</label>
                <select id="registro-categoria" name="categoria.id" required>
                  <option value="">Seleccioná una categoría</option>
                  <option th:each="categoria : ${categoriasRegistro}" th:value="${categoria.id}" th:text="${categoria.nombre}"
                          th:selected="${registroRapido?.categoria?.id == categoria.id}">Alimentación</option>
                </select>
              </div>
              <div class="app-registro-campo">
                <label for="registro-fecha">Fecha</label>
                <input id="registro-fecha" name="fecha" type="date" required th:min="${fechaMinima}" th:max="${fechaMaxima}"
                       th:value="${registroRapido?.fecha ?: fechaHoy}">
              </div>
            </div>

            <!-- Guardar va primero en el HTML para que Enter guarde; el CSS los muestra al revés -->
            <div class="app-registro-acciones">
              <button type="submit" class="btn btn-primary" id="registro-guardar">Guardar</button>
              <button type="submit" class="btn app-registro-otro" name="otro" value="true" id="registro-otro">Guardar y cargar otro</button>
              <button type="button" class="btn app-registro-cancelar" data-bs-dismiss="modal">Cancelar</button>
            </div>
          </form>

          <!-- Desde un comprobante: elegir la foto o el PDF ya lo envía (registro_rapido.js) y se pasa
               a revisar lo leído en su pantalla; al confirmar se vuelve a esta vista. Sin JavaScript,
               el botón "Analizar" lo envía. -->
          <form th:action="@{/registrar-gasto/comprobante}" method="post" enctype="multipart/form-data"
                class="app-registro-comprobante" id="form-comprobante-rapido">
            <input type="hidden" name="volver" th:value="${volver}">
            <label class="app-registro-subir" for="registro-archivo">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"></path></svg>
              <span>
                <strong>¿Tenés el comprobante?</strong>
                <small>Subí la foto o el PDF (hasta 5 MB) y lo leemos por vos</small>
              </span>
            </label>
            <input id="registro-archivo" name="imagen" type="file" class="app-registro-archivo"
                   accept="image/jpeg,image/png,application/pdf">
            <button type="submit" class="btn app-registro-analizar" id="registro-analizar">Analizar</button>
            <p class="app-registro-analizando" id="registro-analizando" role="status" hidden>
              <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
              Leyendo tu comprobante… puede tardar unos segundos
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
