<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title th:text="${titulo} + ' · Gastitos'">Gastitos</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">

  <!-- Boostrap core css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/gastosapp.css}" />
  <link rel="stylesheet" th:href="@{/css/guia.css}" />
  <script th:src="@{/js/guia.js}" defer></script>
</head>

<body>

  <!-- Navbar desktop: activo = resumen | registrar (sin ítem) | mis-gastos | presupuestos | simulacion | perfil.
       El asistente ya no está en el menú: se abre desde "Analizar mis gastos" en el resumen (rediseño v2).
       Registrar tampoco: se carga desde "+ Registrar gasto" del resumen y de Mis gastos (registro rápido);
       la pantalla /registrar-gasto sigue para la guía, el celular y sin JavaScript.
       Perfil y Salir van en el menú de la cuenta, a la derecha: son de la cuenta, no secciones de la app. -->
  <header th:fragment="navbar(activo)" class="app-navbar d-none d-md-flex">
    <a class="app-brand" th:href="@{/home}">
      <img th:src="@{/img/isotipo-sobre-oscuro.svg}" width="28" height="28" alt="">
      <span>Gastitos</span>
    </a>

    <nav class="app-nav">
      <a th:href="@{/home}" th:aria-current="${activo == 'resumen'} ? 'page'">Resumen</a>
      <a th:href="@{/mostrar-gastos}" th:aria-current="${activo == 'mis-gastos'} ? 'page'">Mis gastos</a>
      <a th:href="@{/presupuestos}" th:aria-current="${activo == 'presupuestos'} ? 'page'">Presupuestos</a>
      <a th:href="@{/simulacion}" th:aria-current="${activo == 'simulacion'} ? 'page'">Simulación</a>
    </nav>

    <!-- Menú de la cuenta (rediseño v2): Perfil y Salir juntos. El botón muestra las iniciales y solo el
         nombre; al desplegar, nombre y apellido con el email (sin nombre cargado, el email). Es un dropdown de Bootstrap; Salir sigue yendo por POST con confirmación -->
    <div class="app-cuenta ms-auto dropdown" th:if="${session.USUARIO != null}"
         th:with="cuenta=${T(com.tallerwebi.presentacion.CuentaDelMenu).de(session.USUARIO)}">
      <button type="button" class="app-cuenta-boton" id="menu-cuenta" data-bs-toggle="dropdown"
              aria-expanded="false" th:classappend="${activo == 'perfil'} ? 'is-activo'">
        <span class="app-cuenta-avatar" aria-hidden="true" th:text="${cuenta.iniciales}">AP</span>
        <span class="app-cuenta-nombre" th:text="${cuenta.nombre}">Ana</span>
        <svg class="app-cuenta-flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <div class="dropdown-menu dropdown-menu-end app-cuenta-menu" aria-labelledby="menu-cuenta">
        <div class="app-cuenta-encabezado">
          <strong th:text="${cuenta.nombreCompleto}">Ana Pérez</strong>
          <small th:if="${cuenta.nombreCompleto != cuenta.email}" th:text="${cuenta.email}">ana@unlam.edu.ar</small>
        </div>
        <a class="dropdown-item app-cuenta-item" th:href="@{/perfil}" id="menu-cuenta-perfil"
           th:aria-current="${activo == 'perfil'} ? 'page'">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.6-3.5 3.1-5.5 7-5.5s6.4 2 7 5.5"></path></svg>
          Mi perfil
        </a>
        <hr class="dropdown-divider">
        <!-- Salir cierra la sesión en el servidor: va por POST, no es un link al login -->
        <form th:action="@{/logout}" method="post" class="app-cuenta-salir"
              data-confirmar-titulo="¿Cerrar sesión?"
              data-confirmar-texto="Vas a salir de Gastitos. Para volver a entrar vas a tener que ingresar tu email y contraseña."
              data-confirmar-boton="Salir">
          <button type="submit" class="dropdown-item app-cuenta-item" id="menu-cuenta-salir">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"></path></svg>
            Salir
          </button>
        </form>
      </div>
    </div>
  </header>

  <!-- Header mobile: flecha de volver + título de la pantalla -->
  <header th:fragment="header-mobile(titulo)" class="app-header-mobile d-md-none">
    <a class="app-volver" th:href="@{${urlCancelar ?: '/home'}}" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"></path>
      </svg>
    </a>
    <span th:text="${titulo}">Título</span>
  </header>

  <!-- Bootstrap, el modal de confirmación y confirmar.js: en todas las páginas, porque "Salir" del
       navbar pide confirmación. Las páginas no incluyen el modal ni el script por su cuenta -->
  <th:block th:fragment="scripts">
    <div th:replace="~{fragments/confirmar :: modal}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"></script>
    <script th:src="@{/js/confirmar.js}" charset="utf-8"></script>
  </th:block>

</body>

</html>
