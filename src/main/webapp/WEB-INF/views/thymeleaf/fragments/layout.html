<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title th:text="${titulo} + ' · Gastitos'">Gastitos</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">

  <!-- Boostrap core css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/gastosapp.css}" />
</head>

<body>

  <!-- Navbar desktop: activo = resumen | registrar | mis-gastos | presupuestos -->
  <header th:fragment="navbar(activo)" class="app-navbar d-none d-md-flex">
    <a class="app-brand" th:href="@{/home}">
      <img th:src="@{/img/isotipo-sobre-oscuro.svg}" width="28" height="28" alt="">
      <span>Gastitos</span>
    </a>

    <nav class="app-nav">
      <a th:href="@{/home}" th:aria-current="${activo == 'resumen'} ? 'page'">Resumen</a>
      <a th:href="@{/registrar-gasto}" th:aria-current="${activo == 'registrar'} ? 'page'">Registrar</a>
      <a th:href="@{/mostrar-gastos}" th:aria-current="${activo == 'mis-gastos'} ? 'page'">Mis gastos</a>
      <a class="disabled" aria-disabled="true">Presupuestos</a>
      <a th:href="@{/simulacion}" th:aria-current="${activo == 'simulacion'} ? 'page'">Simulación</a>
      <a class="disabled" aria-disabled="true">Comparativa</a>
    </nav>

    <a class="app-salir ms-auto" th:href="@{/login}">Salir</a>
  </header>

  <!-- Header mobile: flecha de volver + título de la pantalla -->
  <header th:fragment="header-mobile(titulo)" class="app-header-mobile d-md-none">
    <a class="app-volver" th:href="@{${urlCancelar ?: '/home'}}" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"></path>
      </svg>
    </a>
    <span th:text="${titulo}">Título</span>
  </header>

  <!-- Boostrap core js -->
  <script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>

</body>

</html>
