<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>

<body>

  <main class="app-login">
    <div class="app-login-card">

      <div class="app-login-marca">
        <img th:src="@{/img/isotipo.svg}" width="44" height="44" alt="">
        <span>Gastitos</span>
      </div>

      <h1 class="app-acceso-titulo">Creá tu cuenta</h1>
      <p class="app-acceso-bajada">Registrá tus gastos y controlá tu presupuesto del mes.</p>

      <form action="#" th:action="@{/registrarme}" method="POST" th:object="${usuario}">

        <div class="mb-3">
          <label for="email" class="form-label">Email <span class="app-requerido" aria-hidden="true">*</span></label>
          <input th:field="*{email}" id="email" type="email" class="form-control" autocomplete="email" required />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña <span class="app-requerido" aria-hidden="true">*</span></label>
          <input th:field="*{password}" id="password" type="password" class="form-control"
            autocomplete="new-password" minlength="6" aria-describedby="password-requisitos" required />
          <ul th:replace="~{fragments/contrasena :: requisitos}"></ul>
        </div>

        <div class="mb-4">
          <label for="confirmacion" class="form-label">Repetí la contraseña <span class="app-requerido" aria-hidden="true">*</span></label>
          <input id="confirmacion" type="password" class="form-control" autocomplete="new-password" required
            aria-describedby="confirmacion-error" />
          <div id="confirmacion-error" class="invalid-feedback">Las contraseñas no coinciden.</div>
        </div>

        <p th:if="${error != null}" class="alert alert-danger" th:text="${error}"></p>

        <div class="d-grid">
          <button id="btn-registrarme" class="btn btn-primary" type="submit" disabled>Crear cuenta</button>
        </div>
      </form>

      <p class="app-login-registro">
        ¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a>
      </p>

    </div>
  </main>

  <script th:replace="~{fragments/layout :: scripts}"></script>
  <script type="module" th:src="@{/js/registro.js}"></script>
</body>

</html>
