version: '3.8'

services:
  mysql:
    build:
      context: .
      dockerfile: DockerfileSQL
    container_name: tallerwebi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tallerwebi-network
    restart: unless-stopped

  jetty-app:
    build:
      context: .
      dockerfile: DockerfileJetty
    container_name: tallerwebi-jetty
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - tallerwebi-network
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Asistente con Claude (HU-15); sin la clave, los consejos salen con el texto de las reglas
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASISTENTE_MODELO: ${ASISTENTE_MODELO:-}
      # Recuperar contraseña: cuenta de Gmail y su "contraseña de aplicación" (no la de la cuenta).
      # Sin ellas no se manda el mail. APP_URL es la dirección que va en el link del mail
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_URL: ${APP_URL:-http://localhost:8080/gastitos}

volumes:
  mysql_data:
    driver: local

networks:
  tallerwebi-network:
    driver: bridge 